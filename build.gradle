plugins {
    id 'java'
    id 'com.gradleup.shadow' version '8.3.5'
}

group = 'com.yukile'
version = '1.0.0'

java {
    def javaVersion = JavaVersion.toVersion(21)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
}

repositories {
    mavenCentral()
    maven { url = 'https://repo.papermc.io/repository/maven-public/' }
    maven { url = 'https://repo.dmulloy2.net/repository/public/' }
}

dependencies {
    // Paper API - provided by the server at runtime
    compileOnly 'io.papermc.paper:paper-api:1.21.1-R0.1-SNAPSHOT'

    // ProtocolLib - real API dependency, compileOnly, safe if absent (soft-depend)
    compileOnly 'com.comphenix.protocol:ProtocolLib:5.3.0'

    // NOTE: Citizens, DecentHolograms, FancyHolograms, CMI and HolographicDisplays
    // do not publish reliably-resolvable public Maven artifacts (Citizens' snapshot
    // repository structure changes frequently and breaks CI builds). Instead of a
    // compile-time dependency, all five integrations are implemented via reflection
    // against each plugin's public API/classes at runtime. This keeps the build
    // 100% reproducible on GitHub Actions with zero external repository dependence
    // beyond Paper and ProtocolLib, while still allowing full soft-integration.
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release.set(21)
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}

shadowJar {
    archiveClassifier.set('')
    archiveBaseName.set('HologramViewFix')
    archiveVersion.set(project.version.toString())
}

build {
    dependsOn shadowJar
}

tasks.jar {
    enabled = false
}
