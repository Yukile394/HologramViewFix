name: Build

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure Gradle Wrapper exists
        run: |
          if [ ! -f "./gradlew" ] || [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "Gradle Wrapper missing or incomplete — generating it now."
            gradle wrapper --gradle-version 8.10.2
          else
            echo "Gradle Wrapper already present."
          fi

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build with Gradle Wrapper
        run: ./gradlew build --stacktrace

      - name: Verify JAR was produced
        run: |
          if ! ls build/libs/*.jar 1> /dev/null 2>&1; then
            echo "::error::No JAR found in build/libs — build did not produce an artifact."
            exit 1
          fi
          ls -la build/libs/

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: HologramViewFix
          path: build/libs/*.jar
          if-no-files-found: error

      - name: Commit generated wrapper (first run only)
        if: success()
        run: |
          if [ -n "$(git status --porcelain gradle/wrapper gradlew gradlew.bat 2>/dev/null)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add gradlew gradlew.bat gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties
            git commit -m "chore: add generated Gradle Wrapper [skip ci]" || echo "Nothing to commit"
            git push || echo "Push skipped (likely a PR from a fork or protected branch)"
          else
            echo "Wrapper already committed, nothing to do."
          fi
