name: Build

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Remove any existing wrapper files
        run: |
          rm -f gradlew gradlew.bat
          rm -rf gradle/wrapper

      - name: Generate fresh Gradle Wrapper
        run: gradle wrapper --gradle-version 8.10.2

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build with Gradle Wrapper
        run: ./gradlew build --stacktrace

      - name: Verify JAR was produced
        run: |
          if ! ls build/libs/*.jar 1> /dev/null 2>&1; then
            echo "::error::No JAR found in build/libs — build did not produce an artifact."
            exit 1
          fi
          ls -la build/libs/

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: HologramViewFix
          path: build/libs/*.jar
          if-no-files-found: error
