# =====================================================
# HologramViewFix Configuration
# =====================================================

enabled: true

view-distance:
  enabled: true
  distance: 256

minimum-distance: 0
maximum-distance: 256

# Automatically boosts the client-side view-range of TextDisplay/ItemDisplay/
# BlockDisplay entities based on how large their transform scale is, so big
# scaled-up holograms don't get culled by the client at normal distances.
scale-aware-view-range:
  enabled: true
  # Multiplier applied per unit of scale above 1.0.
  multiplier: 1.5
  max-view-range: 10.0

# Re-sends visibility to every tracked player periodically even if our
# cache still says "visible", to self-heal cases where a client silently
# dropped the spawn packet (chunk reload races, netty hiccups, etc).
force-resync-seconds: 30

# How often (in ticks) the tracker cycle runs. 20 ticks = 1 second.
check-interval: 5

chunk-check: true

fix-flicker: true
fix-missing-holograms: true
fix-display-entities: true
fix-armorstand-holograms: true
fix-citizens: true
fix-packet-holograms: true

integrations:
  citizens: true
  decent-holograms: true
  fancy-holograms: true
  cmi: true
  holographic-displays: true
  protocol-lib: true

performance:
  # Maximum number of holograms re-checked per cycle to avoid TPS impact.
  max-checks-per-cycle: 100

debug: false
